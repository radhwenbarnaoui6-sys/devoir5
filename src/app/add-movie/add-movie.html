<div class="container">
    <div>
      <h2>Ajouter un Movie :</h2>
    </div>
         <form >

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >ID Movie</label>
               <input type="text" [(ngModel)]="newMovie.idMovie"
                   name="idMovie" class="form-control">
              </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Titre Movie</label>
               <input type="text" [(ngModel)]="newMovie.titreMovie"
                   name="titreMovie" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Réalisateur</label>
               <input type="text" [(ngModel)]="newMovie.realisateur"
                   name="realisateur" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Durée (min)</label>
               <input type="number" [(ngModel)]="newMovie.dureeMin"
                   name="dureeMin" class="form-control">
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Note</label>
               <input type="number" [(ngModel)]="newMovie.noteMovie"
                   name="noteMovie" class="form-control">
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date de sortie</label>
                 <input type="date" [(ngModel)]="newMovie.dateSortie"
                     name="dateSortie" class="form-control">
             </div>
              <div class="col-sm-4 col-md-4 col-lg-4">
                <label>Catégorie</label>
                <select [(ngModel)]="newIdCat" name="idCat" class="form-control">
                  @for (cat of categories; track cat.idCategorie) {
                    <option [value]="cat.idCategorie">{{cat.nomCategorie}}</option>
                  }
                </select>
              </div>

       <div class="mt-2">
  <button type="submit" (click)="addMovie()" class="btn btn-success">Ajouter</button>
       </div>

       <div class="mt-2">
        <h3>{{message}}</h3>
             </div>
         </form>
</div>
